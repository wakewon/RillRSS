{% extends "base.html" %}
{% block title %}OPML{% endblock %}
{% block content %}
<div class="crumbs"><a href="/admin/feeds">订阅</a><span>/</span></div>
<div class="page-head"><div><h1>OPML 导入 / 导出</h1><div class="sub">在阅读器与服务之间迁移订阅列表</div></div></div>
<div class="grid-side">
  <div class="card">
    <div class="card-head"><h3>导入</h3></div>
    <form method="post" action="/admin/opml/import" enctype="multipart/form-data" class="stack-sm">
      <input type="hidden" name="csrf" value="{{ base.csrf }}">
      <div class="field"><label for="opml_file">OPML 文件</label><input type="file" id="opml_file" name="file" accept=".opml,.xml,text/xml,application/xml"></div>
      <div class="field"><label for="opml_text">或粘贴 OPML 内容</label><textarea id="opml_text" name="text" rows="6" placeholder="&lt;opml version=&quot;2.0&quot;&gt; …"></textarea></div>
      <div class="help">已存在的订阅会跳过；嵌套的 outline 作为分类导入。RillRSS 导出的 OPML 还会恢复每个订阅的处理选项。</div>
      <div><button class="btn primary"><svg class="icon sm"><use href="#i-upload"/></svg>导入</button></div>
    </form>
  </div>
  <div class="card">
    <div class="card-head"><h3>导出</h3></div>
    <p class="small text-2">包含全部订阅、分类以及每个订阅的处理选项（其他阅读器会忽略这些选项）。</p>
    <a class="btn block" href="/admin/opml/export"><svg class="icon sm"><use href="#i-download"/></svg>下载 OPML</a>
  </div>
</div>
{% endblock %}
