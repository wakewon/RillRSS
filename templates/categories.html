{% extends "base.html" %}
{% block title %}分类{% endblock %}
{% block content %}
<div class="crumbs"><a href="/admin/feeds">订阅</a><span>/</span></div>
<div class="page-head"><div><h1>分类</h1><div class="sub">{{ cats.len() }} 个分类 · 删除分类不会删除其中的订阅</div></div></div>
<div class="card">
  <form method="post" action="/admin/categories" class="form-row">
    <input type="hidden" name="csrf" value="{{ base.csrf }}">
    <div class="field grow"><label for="cat_new">新建分类</label><input type="text" id="cat_new" name="name" required placeholder="分类名称"></div>
    <div class="fixed"><button class="btn primary"><svg class="icon sm"><use href="#i-plus"/></svg>创建</button></div>
  </form>
</div>
<div class="card flush">
{% if cats.is_empty() %}
  <div class="empty"><svg class="icon"><use href="#i-folder"/></svg><div>暂无分类</div></div>
{% else %}
  <div class="table-wrap"><table>
  <thead><tr><th>名称</th><th class="num">订阅</th><th></th></tr></thead>
  <tbody>
  {% for c in cats %}
  <tr>
    <td><form method="post" action="/admin/categories/{{ c.id }}/rename" class="form-row nowrap-row"><input type="hidden" name="csrf" value="{{ base.csrf }}"><input type="text" name="name" value="{{ c.name }}" aria-label="分类名称" class="grow" style="max-width:320px"><button class="btn sm fixed">重命名</button></form></td>
    <td class="num">{{ c.feeds }}</td>
    <td style="text-align:right"><form method="post" action="/admin/categories/{{ c.id }}/delete" class="inline" data-confirm="删除分类「{{ c.name }}」？其中的订阅会变为未分类。"><input type="hidden" name="csrf" value="{{ base.csrf }}"><button class="btn sm danger">删除</button></form></td>
  </tr>
  {% endfor %}
  </tbody>
  </table></div>
{% endif %}
</div>
{% endblock %}
