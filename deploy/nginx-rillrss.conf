# Replace rss.example.com with your domain, confirm the certificate paths, and
# make the proxy_pass port match RILL_PORT in .env.
server {
    listen 80;
    listen [::]:80;
    server_name rss.example.com;

    # Tell API clients to use HTTPS directly; redirects can break POST bodies.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ^~ /tt-rss { return 404; }
    location ^~ /reader/api/0 { return 404; }
    location ^~ /plugins.local/freshapi/api/ { return 404; }

    # 308 keeps the request method and body for browser paths.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rss.example.com;

    ssl_certificate     /etc/letsencrypt/live/rss.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rss.example.com/privkey.pem;

    client_max_body_size 32m;

    # Everything goes to RillRSS. "^~" stops regex locations in this server
    # (hosting panels add rules like "location ~ \.(jpg|png|css)$" or a PHP
    # handler) from answering cached images (/img/…/x.jpg), feed icons
    # (/feed-icons/1.ico) or the .php API paths with 404.
    location ^~ / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
