[package]
name = "rillrss"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Lightweight self-hosted RSS aggregator with Google Reader / TT-RSS APIs, full-text extraction, OpenCC conversion and AI translation"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync", "net", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "compression-br", "timeout", "limit", "set-header", "catch-panic"] }
http = "1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "json", "stream", "http2", "charset", "system-proxy", "form"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
feed-rs = "3"
quick-xml = "0.42"
dom_smoothie = "0.18"
dom_query = "0.28"
ammonia = "4"
ferrous-opencc = "0.4"
whatlang = "0.18"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
askama = "0.16"
argon2 = "0.6"
rand = "0.10"
blake3 = "1"
hex = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8"
chardetng = "1"
imagesize = "0.15"
regex = "1"
mime = "0.3"
percent-encoding = "2"
html-escape = "0.2"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"

# Keep debug builds reasonably fast for tests that parse/convert a lot of text.
[profile.dev.package."*"]
opt-level = 2
