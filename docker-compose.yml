# RillRSS — docker compose up -d --build
# Configure through a .env file next to this file (see .env.example).
services:
  rillrss:
    build:
      context: .
    image: rillrss:latest
    container_name: rillrss
    restart: unless-stopped
    ports:
      - "${RILL_PORT:-8080}:8080"
    environment:
      RILL_USERNAME: ${RILL_USERNAME:-admin}
      RILL_PASSWORD: ${RILL_PASSWORD:-}
      RILL_BASE_URL: ${RILL_BASE_URL:-}
      RILL_TRUST_PROXY: ${RILL_TRUST_PROXY:-true}
      RILL_ALLOW_PRIVATE_NETWORKS: ${RILL_ALLOW_PRIVATE_NETWORKS:-false}
      RILL_TRANSLATE_BASE_URL: ${RILL_TRANSLATE_BASE_URL:-}
      RILL_TRANSLATE_API_KEY: ${RILL_TRANSLATE_API_KEY:-}
      RILL_TRANSLATE_MODEL: ${RILL_TRANSLATE_MODEL:-}
      RILL_LOG: ${RILL_LOG:-info}
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${RILL_DATA_PATH:-./data}:/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
